name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: py_compile 生产运行时
        run: |
          python3 -m py_compile agent_server.py governance_hub.py
      - name: py_compile 文档代码族
        run: |
          find docs/10-YYC3-提示词工程-企业蓝图/13-YYC3-企业蓝图-代码示例 -name "*.py" -not -path "*__pycache__*" -print0 | xargs -0 -r -n1 python3 -m py_compile

  deps-check:
    name: 依赖安装检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装运行时依赖
        run: pip install -r requirements.txt

  unit-tests:
    name: 测试全量门禁 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt
      - name: pytest 全量（单元/集成/UAT 静态契约；LLM 实答自动门控 skip）
        run: python -m pytest tests/ -q --tb=short
      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output
          path: |
            tests/
          retention-days: 7

  docs-links:
    name: 文档完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 检查核心文档存在
        run: |
          for f in README.md CHANGELOG.md CONTRIBUTING.md ARCHITECTURE.md CODE_OF_CONDUCT.md LICENSE docs/README.md; do
            test -f "$f" || { echo "缺失: $f"; exit 1; }
          done
      - name: 检查文档无旧编号死链（010300/010305）
        run: |
          ! grep -rn "010300-FAmily\|010305-FAmily" docs --include="*.md"
      - name: 检查命名归一（无历史旧称「知遇·伯乐」/「知遇伯乐」；蓝图镜像与会话归档为只读历史来源，不在此列）
        run: |
          ! grep -rn "知遇·伯乐\|知遇伯乐" docs examples agents README.md --include="*.md" --include="*.py" --include="*.yml" --include="*.yaml" --exclude-dir="30-YYC3-Family-AI-Agent-企业蓝图" --exclude-dir="20-YYC3-AI-Family-Agent-编程体系" --exclude-dir="90-归档-20260914-会话工作目录"
      - name: 检查代码族无旧编号族名死引用（1300 族更名残留防护，2026-11-26 B2）
        run: |
          ! grep -rn "00-核心基础设施\|04-能力建设智能化\|05-价值创造智能化\|06-协议栈\|07-安全合规\|08-可观测性" "docs/10-YYC3-提示词工程-企业蓝图/13-YYC3-企业蓝图-代码示例" --include="*.py" --include="*.sh" --include="*.yml" --include="*.yaml"
      - name: 检查治理中枢端口代码事实（25700，防 ARCHITECTURE/README 漂移复发，2026-11-26 B2）
        run: |
          grep -q "25700" ARCHITECTURE.md README.md
          ! grep -n ":9100" ARCHITECTURE.md README.md
