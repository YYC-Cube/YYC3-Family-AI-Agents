version: "3.8"
services:
  business_decision_ai:
    image: nvcr.io/nvidia/nemo:latest
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    volumes:
      - /mnt/nas/business_decision_data:/workspace/data
      - /mnt/nas/business_models:/workspace/models
    environment:
      - SERVICE_TYPE=business_decision
      - DATA_DIR=/workspace/data
      - MODEL_PATH=/workspace/models/qwen3.5-122b
    networks:
      - dgxnet
    runtime: nvidia
    command: ["python", "/workspace/scripts/business_decision_inference.py", "--data_dir", "/workspace/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  dgxnet:
    driver: bridge
