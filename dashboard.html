<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YYC³ 治理中枢 · Family-AI Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='18' font-weight='700' font-family='sans-serif' fill='%23fff'%3EY%3C/text%3E%3C/svg%3E" />
<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--surface:rgba(255,255,255,.03);--border:rgba(255,255,255,.08);--text:#f1f1f6;--text2:rgba(255,255,255,.65);--text3:rgba(255,255,255,.35);--v:#8b5cf6;--c:#06b6d4;--e:#22c55e;--r:#ef4444;--y:#eab308;--radius:14px;--mono:'SF Mono','Fira Code',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;gap:12px;padding:20px 0 24px;border-bottom:1px solid var(--border);margin-bottom:20px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--v),var(--c));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff}
h1{font-size:18px}
.sub{font-size:11px;color:var(--text3);margin-top:2px}
.pill{margin-left:auto;font-size:11px;color:var(--text2);border:1px solid var(--border);border-radius:999px;padding:5px 12px}
.pill b{color:var(--e);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi .num{font-size:26px;font-weight:700;font-family:var(--mono)}
.kpi .lbl{font-size:11px;color:var(--text3);margin-top:4px}
.kpi.warn .num{color:var(--y)} .kpi.bad .num{color:var(--r)} .kpi.good .num{color:var(--e)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h2{font-size:13px;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--text3);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
tr:hover td{background:rgba(255,255,255,.03)}
.mono{font-family:var(--mono);font-size:11px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
.tag.active{background:rgba(34,197,94,.15);color:var(--e)}
.tag.frozen{background:rgba(239,68,68,.15);color:var(--r)}
.tag.low{background:rgba(34,197,94,.12);color:var(--e)}
.tag.medium{background:rgba(234,179,8,.12);color:var(--y)}
.tag.high,.tag.critical{background:rgba(239,68,68,.15);color:var(--r)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--v),var(--c))}
.bar i.hot{background:linear-gradient(90deg,var(--y),var(--r))}
.agent-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.agent-row:hover{background:rgba(255,255,255,.03)}
.a-name{width:150px;font-size:12px;font-weight:600}
.a-state{width:70px}
.a-budget{flex:1}
.a-pct{width:70px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--text2)}
footer{margin-top:24px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);display:flex;justify-content:space-between}
a{color:var(--c);text-decoration:none}
button.refresh{margin-left:12px;background:linear-gradient(135deg,var(--v),var(--c));border:none;color:#fff;font-size:11px;padding:6px 14px;border-radius:999px;cursor:pointer}
button.refresh:hover{opacity:.85}
.empty{color:var(--text3);font-size:12px;text-align:center;padding:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Y</div>
    <div>
      <h1>YYC³ 治理中枢 · Family-AI Dashboard</h1>
      <div class="sub">Hub-and-Spoke 治理 · 1+8 拟人化 Agent 家族 · 五维驱动</div>
    </div>
    <span class="pill" id="conn">连接中…</span>
    <button class="refresh" onclick="loadAll()">刷新</button>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card">
      <h2><span class="dot"></span>Agent 家族状态与 Token 预算（日窗口）</h2>
      <div id="agents"><div class="empty">加载中…</div></div>
    </div>
    <div class="card">
      <h2><span class="dot"></span>最近治理事件（审计追踪 · 最新 15 条）</h2>
      <div id="events"><div class="empty">加载中…</div></div>
    </div>
  </div>

  <footer>
    <span>YYC³ FAmily-AI · <a href="/health">/health</a> · <a href="/metrics">/metrics</a> · <a href="/dashboard">/dashboard (JSON)</a></span>
    <span>Words Initiate Quadrants, Language Serves as Core for the Future</span>
  </footer>
</div>

<script>
const FAMILY = {
  tianshu:{cn:'元启·天枢',icon:'🧭'}, qianxing:{cn:'言启·千行',icon:'🧭'},
  wanwu:{cn:'语枢·万物',icon:'🧠'}, xianzhi:{cn:'预见·先知',icon:'🔮'},
  bole:{cn:'千里·伯乐',icon:'🐎'}, shouhu:{cn:'智云·守护',icon:'🛡️'},
  zongshi:{cn:'格物·宗师',icon:'⚖️'}, lingyun:{cn:'创想·灵韵',icon:'✨'}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);return r.json()}

function kpiCard(num,lbl,cls=''){return `<div class="kpi ${cls}"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`}

function renderKpis(d){
  const budgets=Object.values(d.budgets||{});
  const blocked=budgets.filter(b=>b.daily?.blocked||b.weekly?.blocked||b.monthly?.blocked).length;
  $('kpis').innerHTML=[
    kpiCard(Object.keys(d.agents||{}).length,'Agent 在册','good'),
    kpiCard(d.behavior_events_total??0,'治理事件累计'),
    kpiCard(d.high_risk_events_24h??0,'24h 高危事件',d.high_risk_events_24h>0?'bad':'good'),
    kpiCard((d.tokens_consumed_24h??0).toLocaleString(),'24h Token 消耗'),
    kpiCard(d.collaborations_24h??0,'24h 协同触发'),
    kpiCard(blocked,'预算熔断 Agent',blocked>0?'warn':'good'),
  ].join('');
}

function renderAgents(d){
  const states=d.agents||{}, budgets=d.budgets||{};
  let html='';
  for(const [short,meta] of Object.entries(FAMILY)){
    const st=states[short]||{state:'unknown',frozen_reason:''};
    const b=budgets[short]?.daily||{};
    const pct=Math.min(100,Math.round((b.used||0)/(b.limit||1)*1000)/10);
    const hot=pct>=80;
    html+=`<div class="agent-row">
      <span>${meta.icon}</span>
      <span class="a-name">${meta.cn}<div class="mono" style="color:var(--text3)">${short}</div></span>
      <span class="a-state"><span class="tag ${st.state==='frozen'?'frozen':'active'}">${st.state}</span></span>
      <span class="a-budget"><div class="bar"><i class="${hot?'hot':''}" style="width:${pct}%"></i></div></span>
      <span class="a-pct">${pct}%<div class="mono" style="color:var(--text3)">${(b.used||0).toLocaleString()}</div></span>
    </div>`;
  }
  $('agents').innerHTML=html;
}

function renderEvents(trail){
  if(!Array.isArray(trail)||!trail.length){$('events').innerHTML='<div class="empty">暂无治理事件</div>';return}
  $('events').innerHTML=`<table><thead><tr><th>时间</th><th>Agent</th><th>动作</th><th>风险</th><th>correlation_id</th></tr></thead><tbody>${
    trail.slice(0,15).map(e=>`<tr>
      <td class="mono" style="color:var(--text3)">${esc((e.timestamp||'').slice(5,19))}</td>
      <td>${esc(FAMILY[e.agent]?.cn||e.agent)}</td>
      <td>${esc(e.action)}</td>
      <td><span class="tag ${esc(e.risk)}">${esc(e.risk)}</span></td>
      <td class="mono" style="color:var(--c)">${esc((e.correlation_id||'').slice(0,8))}</td>
    </tr>`).join('')}</tbody></table>`;
}

async function loadAll(){
  try{
    const [dash,trail]=await Promise.all([jget('/dashboard'),jget('/audit/trail?limit=15')]);
    renderKpis(dash);renderAgents(dash);renderEvents(trail);
    $('conn').innerHTML=`已连接 · <b>healthy</b>`;
  }catch(err){
    $('conn').innerHTML=`连接失败`;$('conn').querySelector('b')?.remove();
    console.error(err);
  }
}
loadAll();setInterval(loadAll,30000);
</script>
</body>
</html>
