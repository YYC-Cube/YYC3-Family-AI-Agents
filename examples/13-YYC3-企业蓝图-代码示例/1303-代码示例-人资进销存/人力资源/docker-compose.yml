version: "3.8"
services:
  hr_ai:
    image: nvcr.io/nvidia/nemo:latest
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /mnt/nas/hr_data:/workspace/data
      - /mnt/nas/hr_models:/workspace/models
    environment:
      - SERVICE_TYPE=hr
      - DATA_DIR=/workspace/data
      - MODEL_PATH=/workspace/models/hr_model.pt
    networks:
      - dgxnet
    runtime: nvidia
    command: ["python", "/workspace/scripts/hr_inference.py", "--data_dir", "/workspace/data", "--model_path", "/workspace/models/hr_model.pt"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  dgxnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
