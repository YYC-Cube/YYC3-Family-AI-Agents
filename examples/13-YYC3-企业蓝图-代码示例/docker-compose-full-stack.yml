# =============================================================================
# YYC³ AI Family Agent 全栈部署文件 v3.0
# 对齐蓝图: 1200-AI Family Agent v2.1.0
# 五高架构: 高可用 | 高性能 | 高安全 | 高扩展 | 高智能
# 
# 端口规划 (遵循5位结构 XXYYZ):
#   前端: 20000-24999    后端: 25000-29999
#   中间件: 30000-34999   容器: 35000-39999
#   AI服务: 40000-44999   运维: 45000-49150
#
# 服务端口映射:
#   元启·天枢: 25600  言启·千行: 25601  语枢·万物: 25602
#   预见·先知: 25603  千里·伯乐: 25604  智云·守护: 25605
#   格物·宗师: 25606  创想·灵韵: 25607
#   MCP网关: 30800    A2A网关: 30801
#   内容过滤: 30802    零信任: 30803    可观测性: 30804
# =============================================================================

version: "3.8"

# =============================================================================
# 网络规划
# =============================================================================
networks:
  agent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
  business-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  observability-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  security-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:

services:
  # ========================================================================
  # 🔴 基础设施层
  # ========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yyc3-postgres
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: yyc3_ai_family
      POSTGRES_USER: yyc3_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yyc3_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - business-network
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yyc3_admin -d yyc3_ai_family"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yyc3-redis
    ports:
      - "26379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-yyc3_redis_2026}
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    restart: unless-stopped

  # ========================================================================
  # 🟡 协议栈层 (MCP + A2A)
  # ========================================================================
  mcp_gateway:
    image: python:3.12-slim
    container_name: yyc3-mcp-gateway
    ports:
      - "30800:8800"
    volumes:
      - ./06-协议栈/MCP:/workspace
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=8800
    working_dir: /workspace
    command: sh -c "pip install flask requests && python mcp_client.py"
    networks:
      - agent-network
      - security-network
    restart: unless-stopped

  a2a_gateway:
    image: python:3.12-slim
    container_name: yyc3-a2a-gateway
    ports:
      - "30801:8801"
    volumes:
      - ./06-协议栈/A2A:/workspace
    environment:
      - A2A_PORT=8801
    working_dir: /workspace
    command: sh -c "pip install flask requests && python a2a_client.py"
    networks:
      - agent-network
      - security-network
    restart: unless-stopped

  # ========================================================================
  # 🟢 安全层
  # ========================================================================
  content_filter:
    image: python:3.12-slim
    container_name: yyc3-content-filter
    ports:
      - "30802:8802"
    volumes:
      - ./07-安全合规:/workspace
    environment:
      - FILTER_LEVEL=standard
      - PORT=8802
    working_dir: /workspace
    command: sh -c "pip install flask && python content_filter.py"
    networks:
      - security-network
    restart: unless-stopped

  zero_trust_gateway:
    image: python:3.12-slim
    container_name: yyc3-zero-trust
    ports:
      - "30803:8803"
    volumes:
      - ./07-安全合规:/workspace
    environment:
      - AUTH_MODE=strict
      - PORT=8803
    working_dir: /workspace
    command: sh -c "pip install flask && python zero_trust_gateway.py"
    networks:
      - security-network
      - agent-network
    restart: unless-stopped

  # ========================================================================
  # 🔵 可观测性层
  # ========================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: yyc3-prometheus
    ports:
      - "45909:9090"
    volumes:
      - ./08-可观测性/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - observability-network
      - agent-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: yyc3-grafana
    ports:
      - "45300:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-yyc3_grafana_2026}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - observability-network
    restart: unless-stopped
    depends_on:
      - prometheus

  telemetry:
    image: python:3.12-slim
    container_name: yyc3-telemetry
    ports:
      - "30804:8804"
    volumes:
      - ./08-可观测性:/workspace
    environment:
      - TELEMETRY_PORT=8804
      - PROMETHEUS_URL=http://prometheus:9090
    working_dir: /workspace
    command: sh -c "pip install flask prometheus-client && python telemetry.py"
    networks:
      - observability-network
      - agent-network
    restart: unless-stopped

  # ========================================================================
  # 🟣 AI Family Agent 层 (8个Agent)
  # ========================================================================
  yuanqi_tianshu:
    image: python:3.12-slim
    container_name: agent-yuanqi-tianshu
    ports:
      - "25600:6000"
    volumes:
      - ./04-AI-Family-Agent/元启-天枢总指挥:/workspace
      - ./06-协议栈:/workspace/protocols
      - ./08-可观测性:/workspace/telemetry
    environment:
      - AGENT_NAME=yuanqi_tianshu
      - AGENT_ROLE=coordinator
      - PORT=6000
      - MCP_ENDPOINT=http://mcp_gateway:8800
      - A2A_ENDPOINT=http://a2a_gateway:8801
    working_dir: /workspace
    command: sh -c "pip install flask requests && python ytianshu_agent.py --port 6000"
    networks:
      - agent-network
      - security-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - mcp_gateway
      - a2a_gateway
      - telemetry

  yanqi_qianhang:
    image: python:3.12-slim
    container_name: agent-yanqi-qianhang
