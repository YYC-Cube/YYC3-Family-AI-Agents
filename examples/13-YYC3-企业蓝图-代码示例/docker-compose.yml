# =============================================================================
# YYC³ AI Family Agent 全栈 Docker Compose v3.0
# 对齐蓝图: 1200-AI Family Agent v2.1.0
# 五高架构: 高可用 | 高性能 | 高安全 | 高扩展 | 高智能
# 协议栈: MCP + A2A
# 基座模型: GLM-6 / Qwen-4.0 / DeepSeek-V3
# =============================================================================

version: "3.8"

# =============================================================================
# 网络规划
# =============================================================================
networks:
  # AI Family Agent 内部通信网络
  agent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
  # 业务服务网络
  business-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # 可观测性网络
  observability-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  # 安全网关网络
  security-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

# =============================================================================
# 卷定义
# =============================================================================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  model_cache:
    driver: local

# =============================================================================
# 服务定义
# =============================================================================
services:
  # ========================================================================
  # 🔴 基础设施层
  # ========================================================================

  # PostgreSQL - 结构化数据存储
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yyc3-postgres
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: yyc3_ai_family
      POSTGRES_USER: yyc3_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yyc3_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - business-network
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yyc3_admin -d yyc3_ai_family"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - 缓存与会话存储
  redis:
    image: redis:7-alpine
    container_name: yyc3-redis
    ports:
      - "26379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-yyc3_redis_2026}
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================================
  # 🟡 协议栈基础设施层 (MCP + A2A)
  # ========================================================================

  # MCP Gateway - 模型上下文协议网关
  mcp_gateway:
    image: python:3.12-slim
    container_name: yyc3-mcp-gateway
    ports:
      - "30800:8800"
    volumes:
      - ./06-协议栈/MCP:/workspace
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=8800
      - LOG_LEVEL=INFO
    working_dir: /workspace
    command: >
      sh -c "pip install flask requests && python mcp_client.py"
    networks:
      - agent-network
      - security-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # A2A Gateway - Agent间通信协议网关
  a2a_gateway:
    image: python:3.12-slim
    container_name: yyc3-a2a-gateway
    ports:
      - "30801:8801"
    volumes:
      - ./06-协议栈/A2A:/workspace
    environment:
      - A2A_PORT=8801
      - LOG_LEVEL=INFO
    working_dir: /workspace
    command: >
      sh -c "pip install flask requests && python a2a_client.py"
    networks:
      - agent-network
      - security-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8801/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================================================
  # 🟢 安全基础设施层
  # ========================================================================

  # 内容安全过滤器
  content_filter:
    image: python:3.12-slim
    container_name: yyc3-content-filter
    ports:
      - "30802:8802"
    volumes:
      - ./07-安全合规:/workspace
    environment:
      - FILTER_LEVEL=standard
      - PORT=8802
      - LOG_LEVEL=INFO
    working_dir: /workspace
    command: >
      sh -c "pip install flask && python content_filter.py"
    networks:
      - security-network
    restart: unless-stopped

  # 零信任安全网关
  zero_trust_gateway:
    image: python:3.12-slim
    container_name: yyc3-zero-trust
    ports:
      - "30803:8803"
    volumes:
      - ./07-安全合规:/workspace
    environment:
      - AUTH_MODE=strict
      - PORT=8803
      - LOG_LEVEL=INFO
    working_dir: /workspace
    command: >
      sh -c "pip install flask && python zero_trust_gateway.py"
    networks:
      - security-network
      - agent-network
    restart: unless-stopped

  # ========================================================================
  # 🔵 可观测性基础设施层
  # ========================================================================

  # Prometheus - 指标采集
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: yyc3-prometheus
    ports:
      - "45909:9090"
    volumes:
      - ./08-可观测性/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - observability-network
      - agent-network
    restart: unless-stopped

  # Grafana - 可视化面板
  grafana:
    image: grafana/grafana:11.0.0
    container_name: yyc3-grafana
    ports:
      - "45300:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-yyc3_grafana_2026}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./08-可观测性/grafana-dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - observability-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Telemetry SDK 服务
  telemetry:
    image: python:3.12-slim
    container_name: yyc3-telemetry
    ports:
      - "30804:8804"
    volumes:
      - ./08-可观测性:/workspace
    environment:
      - TELEMETRY_PORT=8804
      - PROMETHEUS_URL=http://prometheus:9090
      - LOG_LEVEL=INFO
    working_dir: /workspace
    command: >
      sh -c "pip install flask prometheus-client && python telemetry.py"
    networks:
      - observability-network
      - agent-network
    restart: unless-stopped

  # ========================================================================
  # 🟣 AI Family Agent 层 (8个Agent)
  # ========================================================================

  # 元启·天枢 (总指挥) - 全局编排与战略决策
